<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self';" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- 标题栏（可拖动窗口） -->
  <header id="titlebar">
    <span>专注面板</span>
    <button id="btn-close" title="关闭">×</button>
  </header>

  <main>
    <!-- 计时状态 -->
    <section id="timer-card">
      <span id="mode-chip">空闲</span>
      <div id="clock">25:00</div>
      <div id="round-line">&nbsp;</div>
      <div id="timer-actions">
        <button id="btn-pause" disabled>暂停</button>
        <button id="btn-stop" disabled>停止</button>
      </div>
    </section>

    <!-- 启动入口（v1.7.0：支持命名与常用预设） -->
    <section id="launch">
      <div class="name-row">
        <input id="in-name" type="text" maxlength="20" placeholder="这个番茄钟叫什么？（可选，如：写报告）">
        <button id="btn-save-preset" title="把当前名称存为常用">存为常用</button>
      </div>
      <div id="presets"></div>
      <div class="row">
        <button id="btn-pomo" class="primary">开始番茄钟</button>
        <button id="btn-count">开始倒计时</button>
      </div>
    </section>

    <!-- 设置 -->
    <section id="settings">
      <label>专注 <input id="in-focus" type="number" min="1" max="240" value="25"> 分钟</label>
      <label>休息 <input id="in-break" type="number" min="1" max="120" value="5"> 分钟</label>
      <label>倒计时 <input id="in-count" type="number" min="1" max="120" value="10"> 分钟</label>
      <label class="chk"><input id="in-ring" type="checkbox" checked> 结束铃声</label>
      <label class="chk"><input id="in-bubble" type="checkbox" checked> 头顶倒计时</label>
    </section>

    <!-- 统计 -->
    <section id="stats">
      <h2>专注统计</h2>
      <div id="cards">
        <div class="card"><p>今日完成</p><b id="s-today-count">0</b><i>个</i></div>
        <div class="card"><p>今日专注</p><b id="s-today-min">0</b><i>分钟</i></div>
        <div class="card"><p>连续天数</p><b id="s-streak">0</b><i>天</i></div>
        <div class="card"><p>累计完成</p><b id="s-total-count">0</b><i>个</i></div>
      </div>
      <p id="chart-title">近 7 天专注分钟数</p>
      <div id="chart"></div>
      <div id="chart-x"></div>
      <p id="chart-title">按名称统计（复盘）</p>
      <div id="by-name"></div>
      <p id="chart-title">最近记录</p>
      <div id="records"></div>
    </section>
  </main>

  <script src="panel.js"></script>
</body>
</html>
