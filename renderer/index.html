<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>雪乃桌宠</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>

<!-- 窗口顶部：徽章 + 气泡摞在一个纵向 flex 里。
     分开绝对定位的话，番茄钟跑着的时候她一说台词，两个会叠在同一条线上。 -->
<div id="topBar">
  <!-- 倒计时徽章 -->
  <div id="badge" class="hidden">
    <span id="badgeName">专注</span>
    <span id="badgeTime">25:00</span>
  </div>

  <!-- 对话气泡（磨砂玻璃，材质与尺寸的说明见 pet.css） -->
  <div id="bubble" class="hidden"><span id="bubbleText"></span></div>
</div>

<!-- 角色舞台 -->
<div id="stage">
  <div id="petWrap">
    <!-- 目光跟随层：鼠标在窗口里移动时整层做几百毫秒的微位移，
         看起来像"转头看你"。单独一层是为了不和 #petWrap 上的呼吸/跳跃
         动画抢同一个 transform（两个动画写同一个属性会互相覆盖）。 -->
    <div id="lookWrap">
      <img id="fBase" class="frame on" alt="雪之下雪乃" draggable="false">
      <!-- 害羞腮红：双击 / 摸头 / 番茄完成的正向反馈。
           走纯 CSS，不重绘五官 —— 见 pet.css 里的说明。 -->
      <div id="blush"><i></i><i></i></div>
    </div>
  </div>
</div>

<!-- 漂浮表情 / 粒子 -->
<div id="emote" class="hidden"></div>
<div id="particles"></div>

<!-- 番茄钟面板 -->
<div id="panel" class="hidden">
  <div class="phead">番茄钟</div>

  <div id="pomForm">
    <input id="pomInput" type="text" maxlength="12" placeholder="给这段时间起个名字（如 高数）" autocomplete="off">
    <div class="chips">
      <span class="chip" data-min="15">15</span>
      <span class="chip" data-min="25">25</span>
      <span class="chip" data-min="45">45</span>
      <span class="chip" data-min="60">60</span>
      <span class="chip active" data-min="30">30</span>
    </div>
    <div class="prow">
      <button id="btnStart" class="primary">开始</button>
      <button id="btnStats2">统计</button>
    </div>
  </div>

  <div id="pomRun" class="hidden">
    <div class="running">
      <div id="pomName" class="pname">—</div>
      <div id="pomTime" class="ptime">30:00</div>
    </div>
    <div class="prow">
      <button id="btnPause">暂停</button>
      <button id="btnStop">放弃</button>
      <button id="btnStats">统计</button>
    </div>
  </div>
</div>

<script src="dialogue.js"></script>
<script src="pet.js"></script>
</body>
</html>
