<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>雪乃桌宠 · 浏览器预览</title>
<link rel="stylesheet" href="pet.css">
<style>
  /* 只在预览页生效：给透明窗口一个假桌面背景，方便看效果 */
  html, body { background: #dfe4ee; }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 22% 18%, rgba(255,255,255,.75), transparent 42%),
      linear-gradient(150deg, #cfd9ea 0%, #e7ecf5 55%, #dbe3f0 100%);
  }
  .demo-bar {
    position: fixed; top: 10px; left: 10px; z-index: 999;
    display: flex; gap: 6px; flex-wrap: wrap; max-width: 460px;
    font: 12px/1.5 "Microsoft YaHei", system-ui, sans-serif;
  }
  .demo-bar button {
    padding: 5px 11px; border: 1px solid #b9c2d4; background: rgba(255,255,255,.9);
    border-radius: 8px; cursor: pointer; font: inherit; color: #2f3a52;
  }
  .demo-bar button:hover { background: #fff; border-color: #8f9db8; }
  .demo-note {
    position: fixed; bottom: 10px; left: 10px; z-index: 999; max-width: 400px;
    font: 12px/1.7 "Microsoft YaHei", system-ui, sans-serif; color: #4d5464;
    background: rgba(255,255,255,.88); padding: 8px 11px; border-radius: 8px;
    border: 1px solid rgba(120,130,160,.22);
  }
  .demo-note b { color: #2f3a52; }
  #state-readout {
    position: fixed; top: 10px; right: 10px; z-index: 999;
    font: 11px/1.6 Consolas, "Courier New", monospace; color: #4d5464;
    background: rgba(255,255,255,.88); padding: 6px 9px; border-radius: 8px;
    border: 1px solid rgba(120,130,160,.22); white-space: pre;
  }
  /* 点击穿透的"可交互区"可视化。真机上这一圈之外是穿到桌面去的 ——
     也就是鼠标点下去会落到下面的窗口/图标上，而不是接在她身上。
     为什么必须画出来：这一块算错**只表现为"她某处点不到"或"她旁边一片点不下去"**，
     截图上看不出任何异常（那里本来就是透明的）。看框是唯一能一眼验收的方式。
     默认隐藏，用 hash `hit=1` 或工具条上的「穿透框」开关。 */
  #hit-overlay {
    position: absolute; display: none; z-index: 60;
    pointer-events: none;
    border: 1px dashed #d1445e;
    background: rgba(209, 68, 94, .08);
  }

  /* 把"整个窗口"变成真实视口里的一块。
     #stage 用 position:fixed + translate 充当窗口，于是里面所有 position:absolute 的
     气泡 / 徽章 / 面板 / 粒子都像在真机窗口里一样相对它定位 —— 不用改 pet.css 一行。
     主进程的 moveTo 在预览里换算成 translate，所以"走两步"也看得见。

     注意：这里**故意不**用 inset: auto 40px 0 auto 去把它摆在角落。
     虚拟工作区就是浏览器视口本身，舞台坐标 = 屏幕坐标，这样"贴左边缘"
     "被拖到屏幕外再夹回来"这类演示，读数与像素才对得上。
     （pet.css 里 #stage 是 `inset: 0`，所以这里必须显式写全 left/top 覆盖掉。） */
  /* 首帧的初始尺寸（= 100% 档）。syncStage() 随后会用真实窗口尺寸覆盖它，
     所以这里只是"别让第一帧闪一下"的占位 —— 改 BASE_H 时顺手改一下即可，
     真正的一致性由 selftest 的 [2] 节盯（它比的是 JS 里那三个定义式）。 */
  #stage { position: fixed; left: 0; top: 0; width: 404px; height: 469px; }
</style>
</head>
<body>

<div class="demo-bar">
  <button data-demo="blush">腮红</button>
  <button data-demo="click">单击</button>
  <button data-demo="double">双击</button>

  <button data-demo="look">目光跟随</button>

  <button data-demo="hit">穿透框</button>
  <!-- v3.9：差分图层（眨眼 / 口型 / 表情）。
       为什么要逐个槽位一个按钮而不是一个"眨眼"：眨眼只有 120ms，
       而文档里记过"无头模式下 rAF 几乎不触发、虚拟时间轴和动画对不齐" ——

  <button data-demo="blink">眨眼（一次）</button>

  <button data-demo="eyeNone">眼·放开</button>
  <button data-demo="mouthOpen">嘴·张开（定住）</button>
  <button data-demo="mouthSmile">嘴·微笑（定住）</button>
  <button data-demo="mouthNone">嘴·放开</button>
  <button data-demo="talk">说话（口型连动）</button>
  <!-- v3.8：打扰等级 / 健康提醒 / 你在不在 / 冷落 / 盯着看 / 边缘收边 -->
  <button data-demo="chatterQuiet">打扰·安静</button>
  <button data-demo="chatterNormal">打扰·适中</button>
  <button data-demo="chatterLively">打扰·活泼</button>
  <button data-demo="quietChain">安静档·跑一条链</button>
  <button data-demo="healthSit">提醒·久坐</button>
  <button data-demo="healthWater">提醒·喝水</button>
  <button data-demo="healthEye">提醒·护眼</button>
  <button data-demo="awayShort">你离开一会儿</button>
  <button data-demo="awayLong">你离开很久</button>
  <button data-demo="ignore">连戳（把她惹烦）</button>
  <button data-demo="stare">盯着她看</button>
  <button data-demo="edgeL">收边·贴左</button>
  <button data-demo="edgeR">收边·贴右</button>
  <!-- v3.12：前台应用（环境感知）。浏览器里没有"当前前台窗口"这回事，
       所以只能这样喂进去 —— 走的是渲染层**同一个** onScene 回调，不是另写的演示。 -->
  <button data-demo="sceneCode">场景·写代码</button>
  <button data-demo="sceneBrowser">场景·浏览器</button>
  <button data-demo="sceneVideo">场景·视频</button>
  <button data-demo="sceneChat">场景·聊天</button>
  <button data-demo="sceneDesktop">场景·回到桌面</button>
  <!-- v3.12：时间感知 -->
  <button data-demo="chime">整点报时</button>
  <button data-demo="lateNight">深夜的问候</button>
  <button data-demo="dayN">陪你第 7 天</button>
  <button data-demo="autoQuiet">全屏自动躲（静默）</button>
  <button data-demo="quietBye">手动勿扰（会说告别）</button>
</div>
<div id="state-readout">state: -</div>
<div class="demo-note">
  <b>浏览器预览</b>：真机上这些是透明浮在桌面上的，这里只是垫个背景方便看。<br>
  素材、状态机、台词、番茄钟走的是和真机<b>完全同一份</b> pet.js。
</div>

<div id="stage">
  <!-- 与 index.html 的 DOM 层级保持一致：徽章+气泡在 #topBar 里纵向堆叠，
       面板/粒子仍在"窗口"内 -->
  <div id="topBar">
    <div id="badge" class="hidden">
      <span id="badgeName">专注</span><span id="badgeTime">25:00</span>
    </div>
    <div id="bubble" class="hidden"><span id="bubbleText"></span></div>
  </div>

  <!-- 角色区：与 index.html 同结构 —— 只占窗口底部，顶部留白给气泡。
       漂浮表情与粒子也在这里（百分比基准是角色高度，不是窗口高度）。 -->
  <div id="petArea">
    <div id="petWrap">
      <div id="lookWrap">
        <!-- 与 index.html 同结构。加 #spriteWrap 的理由见 index.html 的注释
             （走动的翻转必须同时作用在基准图和图层上）。 -->
        <div id="spriteWrap">
          <img id="fBase" class="frame on" alt="雪之下雪乃" draggable="false">
          <!-- 走动时的下装两帧（v3.11）。与 index.html 同结构、同顺序。
               只在 #petWrap.walk 期间按步周期硬切（见 pet.css 的 .frame.hem）；
               没有下装层的套装 src 一直是空的，什么也不渲染。 -->
          <img id="fHemA" class="frame hem" alt="" aria-hidden="true" draggable="false">
          <img id="fHemB" class="frame hem" alt="" aria-hidden="true" draggable="false">
          <img id="fEye" class="frame layer" alt="" aria-hidden="true" draggable="false">
          <img id="fMouth" class="frame layer" alt="" aria-hidden="true" draggable="false">
        </div>
        <div id="blush"><i></i><i></i></div>
      </div>
    </div>

    <div id="emote" class="hidden"></div>
    <div id="particles"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="phead">番茄钟</div>
    <div id="pomForm">
      <input id="pomInput" type="text" maxlength="12" placeholder="给这段时间起个名字（如 高数）" autocomplete="off">
      <div class="chips">
        <span class="chip" data-min="15">15</span>
        <span class="chip" data-min="25">25</span>
        <span class="chip" data-min="45">45</span>
        <span class="chip" data-min="60">60</span>
        <span class="chip active" data-min="30">30</span>
      </div>
      <div class="prow">
        <button id="btnStart" class="primary">开始</button>
        <button id="btnStats2">统计</button>
      </div>
    </div>
    <div id="pomRun" class="hidden">
      <div class="running"><div id="pomName" class="pname">—</div><div id="pomTime" class="ptime">30:00</div></div>
      <div class="prow">
        <button id="btnPause">暂停</button><button id="btnStop">放弃</button><button id="btnStats">统计</button>
      </div>

</div>

<!-- 位置约束：与 main.js require 的是同一个文件，所以预览里"拖不出屏幕"
     和真机里是同一段逻辑，不是"看起来像" -->
<script src="../clamp.js"></script>
<script src="../throwphysics.js"></script>
<script>
// 打开调试出口（pet.js 末尾那段用），必须在 pet.js 之前设置
window.__PET_DEBUG__ = true;

// ---- 无 Electron 时的 API 替身，好让 pet.js 原样跑起来 ----
// 注意 onOutfit / onAction 在真机 preload 里是"注册回调"语义（ipcRenderer.on），
// 所以替身也必须把回调存下来，并另外给一个 _fire 入口供演示按钮触发。
// 虚拟工作区 = 浏览器视口。让坐标读数和像素位置一一对应。
const WORK_AREA = { x: 0, y: 0, width: window.innerWidth, height: window.innerHeight };
// 与 main.js 的 OUTFIT_SINK 保持一致。四套都是半身像（参考图在大腿处切断、
// 原画没画脚），所以统一 40 —— 把那刀切面沉到"任务栏"后面。
const SINK = { maid: 40, sailor: 40, coat: 40, winter: 40 };
// 与 main.js 的 BASE_W / BASE_H、SIZES 一致。替身必须把缩放也算进去，
// 否则浏览器里"贴左边缘"和真机会差一截，验收就白做了。
// BASE_H 是**窗口**高度：角色显示高度（400）+ 顶部留白（22% × 窗宽，给气泡用）。
// 这个 0.22 与 pet.css 里 #petArea 的「22cqw」必须是同一个数，selftest 会比对。
// 为什么是 22 而不是 17：见 main.js 的 TOP_PAD_RATIO 注释（五档里最小档最苛刻）。
const BASE_W = 404;
const TOP_PAD_RATIO = 0.22;
const BASE_H = 400 + Math.round(BASE_W * TOP_PAD_RATIO);   // 400 + 89 = 489
// ⚠ 这张表必须与 main.js 的 SIZES 逐项一致（selftest 会比对）——
// 真机按它改窗口，预览按它改舞台。少一档的话，"五档缩放"这一项的验收就是自欺欺人。
const SIZES = { tiny: 0.58, small: 0.72, medium: 1, large: 1.28, huge: 1.58 };
// 素材原始尺寸（宽,高）。真机里主进程直接读 PNG 头拿这个（见 main.js 的 pngSize），
// 这里硬编码是没办法 —— 浏览器里读不到文件头。**selftest 会断言这张表和
// 真实 PNG 尺寸一致**，所以它不会悄悄过期。
// ⚠ v3.4 起四套的高**不再相同**：重制的规则是「用满源、不放大」，
//   输出高 = min(800, 源可用高)，而四套的源分辨率差得很远
//   （水手服 1396 / 女仆装 1009 / 冬装 790 / 冬大衣 762）。
//   所以别再按"都该一样高"去改这里 —— 约束是**宽高比**，不是绝对高。
const SPRITE = { maid: [778, 800], sailor: [376, 800], coat: [560, 762], winter: [413, 790] };
let winW = BASE_W, winH = BASE_H;
// 初始站在右下角，离右边 60px —— 与 main.js 的 createPet 默认位置一致
const ORIGIN = {
  x: WORK_AREA.width - winW - 60,
  y: WORK_AREA.height - winH + SINK.maid
};

// 角色在窗口里实际占多高。量 DOM，而不是把 pet.css 的算式在这里再写一遍 ——
// 单一事实源在 #petArea 的 height（窗口高 − 22cqw），这里只负责读。
function petDisplayH() {
  const el = document.getElementById('petWrap');
  const r = el && el.getBoundingClientRect();
  if (r && r.height) return r.height;
  return Math.round(winH - TOP_PAD_RATIO * winW);   // 首帧布局未就绪时兜底
}

// 与 main.js 的 padXOf 同式：角色水平居中，两侧的透明边不参与夹取。
// 用**角色显示高度**算显示宽，不能用窗口高度 —— 窗口比角色高，
// 拿窗口高乘宽高比会把角色算宽、padX 偏小，贴边时就留一条缝。
function padXFor(outfit) {
  const s = SPRITE[outfit];
  if (!s) return 0;
  return Math.max(0, Math.round((winW - s[0] * (petDisplayH() / s[1])) / 2));
}
function clampVirtual(x, y) {
  const of = window.pet._settings.outfit;
  return PetClamp.clampPos(x, y, WORK_AREA, winW, winH, SINK[of] || 0, padXFor(of));
}

const callbacks = { outfit: [], action: [], scale: [], quiet: [], sfx: [], cursor: [], typing: [],
                    chatter: [], activity: [], health: [], scene: [], perch: [] };
let virtualPos = Object.assign({}, ORIGIN);

function syncStage() {
  const st = document.getElementById('stage');
  if (!st) return;
  st.style.width = winW + 'px';
  st.style.height = winH + 'px';
  // 舞台坐标 = 屏幕坐标，直接平移（不再减 ORIGIN）
  st.style.transform = 'translate(' + virtualPos.x + 'px,' + virtualPos.y + 'px)';
}

window.pet = {
  _settings: { outfit: 'maid', pinned: true, scale: 'medium' },

  getRecords: async () => JSON.parse(localStorage.getItem('pom_demo') || '[]'),
  addRecord: async (r) => {
    const l = JSON.parse(localStorage.getItem('pom_demo') || '[]');
    l.push(r);
    localStorage.setItem('pom_demo', JSON.stringify(l));
    return true;
  },
  clearAll: async () => { localStorage.setItem('pom_demo', '[]'); return true; },

  getSettings: async () => window.pet._settings,
  // 久别重逢（v3.6）。真机里这个值是主进程记的"上次她还在的时刻"算出来的；
  // 预览里没有那东西，所以默认 0（= 第一次见 -> 走普通问候）。
  // 要验分档，用 __petDemo.awaySay(ms) 直接喂一个值进去。
  _awayMs: 0,
  getAway: async () => ({ awayMs: window.pet._awayMs }),
  setSettings: async (s) => {
    Object.assign(window.pet._settings, s);
    if (s.scale) applyVirtualScale(s.scale);
    return window.pet._settings;
  },

  setPinned: async (v) => (window.pet._settings.pinned = !!v),
  moveTo: (x, y) => {
    // 走真实约束。夹不夹得住，直接看角色会不会跑出舞台就知道。
    virtualPos = clampVirtual(x, y);
    syncStage();
    return virtualPos;
  },
  savePos: async (x, y) => (window.pet._settings.pos = clampVirtual(x, y)),
  getBounds: async () => ({ x: virtualPos.x, y: virtualPos.y, width: winW, height: winH }),
  getWorkArea: async () => Object.assign({}, WORK_AREA, {
    sink: SINK[window.pet._settings.outfit] || 0, petW: winW, petH: winH,
    padX: padXFor(window.pet._settings.outfit)
  }),
  setBlock: () => {},
  // 点击穿透（v3.5）。真机里主进程拿 hitArea 去撞光标、据此决定整窗穿不穿透；
  // 浏览器里没有穿透这回事，但**必须把这两个调用接下来**：
  //   一是少了它 pet.js 会直接 TypeError（selftest 的 [11d] 正在盯这条）；
  //   二是"可交互区算得对不对"只有在这里才验得了 —— 而它算错的方向恰恰是
  //   "她本身上点不到"，纯看截图永远看不出来（那一带本来就是透明的）。
  //
  // ⚠ 这里要把**视口坐标换算成窗口本地坐标**，别直接存。
  //   pet.js 报的是 getBoundingClientRect() 的结果：真机里视口原点就是窗口原点，
  //   所以它天然是"窗口本地"；而预览页的 #stage 被 translate 到了 virtualPos，
  //   于是同一个值在这里是**页面坐标**，两者差了一个 virtualPos（水手服下就是
  //   x 差 816）——不换算的话，主进程那套 `pt - b.x` 的算法在真机对、在这里全错，
  //   而虚线框会被画到屏幕外去（实测过一次：框不见了，读数却"看着正常"）。
  //   主进程的角色就是把屏幕坐标换算成窗口本地，所以这里做同一件事才是忠实的替身。
  setHitArea: (r) => {
    window.pet._hitAreaRaw = r;
    window.pet._hitArea = r ? {
      l: r.l - virtualPos.x, t: r.t - virtualPos.y,
      r: r.r - virtualPos.x, b: r.b - virtualPos.y
    } : null;
    drawHitOverlay(window.pet._hitArea);
    return window.pet._hitArea;
  },
  markOver: async () => { window.pet._overCount = (window.pet._overCount || 0) + 1; return true; },
  _hitArea: null,
  _hitAreaRaw: null,
  _overCount: 0,

    overlayEl = document.createElement('div');
    overlayEl.id = 'hit-overlay';
    st.appendChild(overlayEl);
  }
  if (!showHit || !box) { overlayEl.style.display = 'none'; return; }
  overlayEl.style.display = 'block';
  overlayEl.style.left = box.l + 'px';
  overlayEl.style.top = box.t + 'px';
  overlayEl.style.width = (box.r - box.l) + 'px';

function applyVirtualScale(k) {
  if (!SIZES[k]) k = 'medium';
  const oldW = winW, oldH = winH;
  winW = Math.round(BASE_W * SIZES[k]);
  winH = Math.round(BASE_H * SIZES[k]);
  if (winH !== oldH || winW !== oldW) {
    // 与 main.js 的 applyScale 同样是"底边 + 水平中心"为锚
    virtualPos.x = Math.round(virtualPos.x + oldW / 2 - winW / 2);
    virtualPos.y = Math.round(virtualPos.y + oldH - winH);
  }
  virtualPos = clampVirtual(virtualPos.x, virtualPos.y);
  syncStage();

}

window.addEventListener('resize', () => {
  WORK_AREA.width = window.innerWidth;
  WORK_AREA.height = window.innerHeight;
  virtualPos = clampVirtual(virtualPos.x, virtualPos.y);
  syncStage();
});

virtualPos = clampVirtual(ORIGIN.x, ORIGIN.y);
syncStage();

// 真机的 nx 是主进程算好的（nx = (光标x − 窗口中心) / (窗宽 × 0.9)）。
// 预览里没有真实光标，就得把这个式子**反解**回一个屏幕坐标喂进去 ——
// 否则 cursor.x 恒等于 0，"主动靠近"会一路朝屏幕左上角走，验的就成了错的东西。
function cursorScreenX(nx) {
  return Math.round(virtualPos.x + winW / 2 + nx * winW * 0.9);
}

    if (sc === 'desktop') {
      // desktop 这一组是**故意留空**的：回到桌面时她什么都不说。
      // 所以这里不 pinBubble —— 气泡框弹出来反而是验收看走了眼的样子，
      // 真正要看的是右下角读数里的 scene= 变成了 desktop。
      return;
    }
    if (got !== sc) demo.quote(['……（场景没接住：期望 ' + sc + '，实到 ' + got + '）']);
    pinBubble();
  }
  if (k === 'chime') {
    // 直接演一次整点报时（真等整点得等到下一个钟点）。
    demo.chime();
    pinBubble();
  }
  if (k === 'lateNight') {
    // 深夜那一组问候，走的是启动问候用的**同一个** QUOTES.daypart。
    demo.quote(window.QUOTES.daypart.lateNight);
    pinBubble();
  }
  if (k === 'dayN') {
    // "陪你第 7 天"。里程碑要等好多天，所以直接演。
    demo.dayN(7);
    pinBubble();
  }
  if (k === 'autoQuiet') {
    // 自动勿扰（全屏自动躲）：她**静默**消失，不说告别。
    // 与下面的 quietBye（手动档，会说"我出去了"）并排点一次，
    // 就能看到两条路唯一可见的差别 —— 也正是 bye 那个字段的全部意义。
    // ⚠ 先把气泡收干净再喂：截图那一刻开机问候那句往往还挂着，
    //   不清掉的话这一格看起来"自动档也说话了"，**正好把要验的东西验反**。
    const bb = document.getElementById('bubble');
    if (bb) { bb.classList.add('hidden'); bb.style.opacity = '0'; }
    demo.autoQuiet();
  }
  if (k === 'quietBye') {
    // 手动勿扰：同一件事，但她会说一句告别。说完才冻（冻结被推迟到 QUIET_BYE_MS）。
    demo.manualQuiet();
    pinBubble();      // 告别那句是短流程，不定格就抓不到（和 say= 同一个坑）
  }
}

function seedDemoRecords() {
  const now = Date.now(), day = 86400000;
  const rows = [
    ['高数', 30, true, 0], ['高数', 25, true, 0.4], ['英语阅读', 25, true, 0.2],
    ['有机化学', 45, true, 1], ['有机化学', 20, false, 1.2], ['写代码', 60, true, 2],
    ['写代码', 30, true, 2.3], ['高数', 15, true, 3], ['英语阅读', 45, true, 3.5],
    ['写代码', 90, true, 4]
  ];
  const list = rows.map(([name, minutes, completed, daysAgo], i) => ({
    name, minutes, completed, planned: minutes,
    startedAt: now - daysAgo * day - i * 60000,
    endedAt: now - daysAgo * day - i * 60000 + minutes * 60000
  }));
  localStorage.setItem('pom_demo', JSON.stringify(list));
  const d = window.__petDemo;
  if (d) { d.quote(['示例数据已写入。……别拿去当成绩单。']); d.emote('✅'); }
}

document.querySelectorAll('.demo-bar button').forEach((b) => {
  b.addEventListener('click', () => dispatchDemo(b.dataset.demo));
});

// 支持用 hash 直接触发某个演示，例如
//   preview.html#demo=outfit
//   preview.html#o=sailor&quiet=1     <- 定格某套装扮，供截图逐张验收
//     demo=xxx               要触发的演示
//     o=<outfit>             直接换上这套装扮（走真机的换装入口）
//     sc=<scale>             直接切到某档大小（small / medium / large）
//     hold=blush             把腮红定格在动画中段的浓度（见下）
//     say=<文字>             让她说这句台词，并**定格**住不自动消失（见下）
//     lu=<等级>              直接放一次升级演出（气泡同样定格），供截图验收
//     quiet=1                一直藏住气泡，免得挡住脸
//     hit=1                  画出点击穿透的可交互区（虚线框**之外**会穿到桌面去）
//     delay=600              触发时刻（毫秒，虚拟时间）

// 把气泡定格住。截图走 --virtual-time-budget，虚拟时间轴比真实定时器跑得快，
// 不定格的话抓到的多半是"已经收尾"的那一帧 —— 和 hold=blush 是同一个坑。
// 凡是"说完就收"的短流程（say= / lu=）都得过这里。
function pinBubble() {
  const b = document.getElementById('bubble');
  if (!b) return;
  const pin = () => { b.classList.remove('hidden'); b.style.opacity = '1'; };
  pin();
  setInterval(pin, 60);
}

(function autoFromHash() {
  const p = new URLSearchParams(decodeURIComponent(location.hash.replace(/^#/, '')));
  const k = p.get('demo'), o = p.get('o'), sc = p.get('sc'), hold = p.get('hold');
  const say = p.get('say'), lu = p.get('lu'), away = p.get('away');
  // 带**任一**参数就往下走。
  // ⚠ 这里刻意判"有没有参数"，而不是逐项列举 !k && !o && !sc && ...：
  //   逐项列举的版本已经坑过一次 —— 新加 ro / wait / noblink 时忘了同步进来，
  //   表现是"参数静默失效"，而它和"样式写错了"在截图上完全分不出来
  //   （本次是 ro=0 没生效、读数糊在她脸上）。从 p.keys() 推导之后，
  //   新参数**不可能**再漏进这张名单。
  if (![...p.keys()].length) return;

  // ro=0 —— 藏掉右上角那块调试读数。验收图里它常常正好压在角色头上，
  // 而"她脸上有没有多出白块 / 眼睛歪了没有"这件事必须看得见。
  // ⚠ 只有显式给 ro=0 才藏：多数验收图是**靠这块读数当证据**的
  //   （例如"腮红的 blush 值是 0 还是满的"），默认藏掉会让那些图失去判据。
  if (p.get('ro') === '0') {
    const ro = document.getElementById('state-readout');
    if (ro) ro.style.display = 'none';
  }

  // hit=1 —— 把点击穿透的"可交互区"虚线框打开，供截图验收。
  // 可交互区是**运行时量 DOM** 算出来的（依赖素材解码后的宽高比与角色区高度），
  // 所以只能等 pet.js 启动、素材 load 之后再打开 —— 这里先记着，
  // 下面 setTimeout 里再切。直接在这里切会拿到一个还没上报的状态。
  if (p.get('hit') === '1') setTimeout(() => setShowHit(true), 1400);

  // hold=blush —— 把腮红**定格**在动画中段的浓度，供截图验收。
  // 为什么需要定格：截图走 --virtual-time-budget，虚拟时间轴和 CSS 动画的时间轴
  // 对不齐。实测同一组参数跑两次，一次抓到动画中段、一次抓到已经收尾的那一帧
  // （右上角 readout 的 blush 值会是 0），而腮红全长只有 1.7s，靠运气验收不可靠。
  // 定格之后人眼要判断的是"画在哪、浓淡如何"，动画流畅度在真机点按钮看。
  if (hold === 'blush') {
    const bl = document.getElementById('blush');
    bl.style.animation = 'none';          // inline 优先于 pet.css 的 #blush.on
    bl.style.opacity = '0.92';            // 取动画 16%~70% 之间的平台值
  }

  setTimeout(() => {
    if (p.get('seed')) seedDemoRecords();
    if (sc && window.__petDemo) window.__petDemo.setScale(sc);
    if (o && window.__petDemo) window.__petDemo.pet(o);
    if (k) {
      // demoDelay=<毫秒>：把演示往后推一点再触发。
      // 需要它的场景是"演示依赖前面刚做的换装/缩放" —— 换装走的是 150ms 交叉淡入
      // （applyOutfit 刻意留的），图片还没换完就投掷的话，spriteW() 读到的还是
      // 上一套的尺寸，等于在验一个不存在的状态。
      const dd = parseInt(p.get('demoDelay') || '0', 10);
      const fire = () => dispatchDemo(k);
      // wait=layers —— 等差分图层**解码就绪**再派发。
      // 不加这个的话，delay 到点时图层 PNG 常常还在解码：layerImg() 按
      // naturalWidth 判空 → 静默退回基准立绘 → 验收图上和"接线断了"一模一样。
      // 走 pet.js 的 onLayersReady（事件驱动，不吃虚拟时间轴）。
      if (p.get('wait') === 'layers' && window.__petDemo && window.__petDemo.onLayersReady) {
        const go = () => window.__petDemo.onLayersReady(fire);
        if (dd > 0) setTimeout(go, dd); else go();
      } else if (dd > 0) setTimeout(fire, dd);
      else fire();
    }
    // say= 与 demo= 可以同时给（例如「番茄钟跑着时她说话」—— 徽章和气泡同时在），
    // 所以这里**不是** else if。
    if (say && window.__petDemo) {
      window.__petDemo.quote([say]);
      pinBubble();
    }
    // lu=<等级>：直接放一次升级演出（台词 + 粒子 + 腮红 + 表情）。
    // 它的台词也是"说完就收"，所以一样要定格。
    if (lu && window.__petDemo) {
      window.__petDemo.showLevelUp(parseInt(lu, 10) || 2);
      pinBubble();
    }
    // away=<毫秒>：直接演一次"久别重逢"的第一句，供截图验收。
    // 真机上这个值来自主进程记的"上次她在"（只有重启才会变），无头截图里等不到它变，
    // 所以由参数直接喂进 awayLine —— 分档逻辑本身仍然只有一份，不在这里重写。
    // 传 0 或没到门槛（< 30 分钟）时它返回 null，那时**不该**定格：
    // "重启一次电脑不该被判成重逢"正是要验的东西之一。
    if (away && window.__petDemo) {
      if (window.__petDemo.awaySay(parseInt(away, 10) || 0)) pinBubble();
    }
  }, parseInt(p.get('delay') || '600', 10));
  // 注意必须判 === '1'：query 值都是字符串，"0" 也是真值
  if (p.get('quiet') === '1') {
    setInterval(() => document.getElementById('bubble').classList.add('hidden'), 60);
  }
  // noblink=1 —— 关掉自动眨眼。
  // 和 hold=blush 同一个理由：眨眼间隔是随机的（3~7s），
  // 一次自动眨眼就能把"基准（睁眼）"那一格拍成半睁 —— 而"基准 vs 半睁"
  // 的差别正好是差分图层那组对照图要判的东西。
  if (p.get('noblink') === '1' && window.__petDemo) window.__petDemo.freezeBlink();
  // pin=1 —— 钉住气泡，让她刚说的那句在截图里留得住。
  // 和 hold=blush 同一个理由：截图走虚拟时间轴，气泡的 2~3 秒在那条时间轴上
  // 几乎瞬间就过完了，不定格的话截到的永远是"已经收尾"的空白。
  // ⚠ 必须比 demo 的 delay 晚生效 —— 所以放在 setTimeout 里面（见上）。
  if (p.get('pin') === '1') setTimeout(pinBubble, parseInt(p.get('delay') || '600', 10) + 120);
  // badge=1 —— 强制显示倒计时徽章。只为验收"徽章和气泡同时在场时排得对不对"
  // （真机里徽章要等番茄钟跑起来才出现，无头截图里没法先点一遍"开始"）。
  if (p.get('badge') === '1') {
    const bd = document.getElementById('badge');
    const pinB = () => bd.classList.remove('hidden');
    pinB();
    setInterval(pinB, 60);
  }
})();

// 状态读数，方便确认状态机真的在动
const readout = document.getElementById('state-readout');
setInterval(() => {
  if (!window.__petDemo) return;
  const s = window.__petDemo.getState();
  readout.textContent =
    'viewport: ' + window.innerWidth + 'x' + window.innerHeight + '\n' +
    'outfit : ' + s.outfit + '\n' +
    'mode   : ' + s.mode + '\n' +
    'sleep  : ' + s.sleeping + '   waking:' + s.waking + '\n' +
    'scale  : ' + s.scale + ' (' + winW + 'x' + winH + ')\n' +
    'pom    : ' + s.hasPom + '\n' +
    // 羁绊 / 勿扰 / 音效：这三个是新加的，读数不摆出来的话，
    // 无头截图完全没法判断"升级演出到底触发了没""勿扰有没有把她冻住"。
    'bond   : Lv.' + s.bond + '  ' + s.points + 'pt\n' +
    'quiet  : ' + s.quiet + '\n' +
    'sfx    : ' + s.sfx + '\n' +
    // v3.8：打扰等级 / 你在不在 / 是否正在冷落她 / 收边请求。
    // 这四个不摆出来的话，无头截图判断不了"安静档有没有把台词吞掉"
    // "她是不是因为你不在才睡的""贴边那一下有没有发出收边请求"。
    'chatter: ' + s.chatter + '  active:' + s.active +
      '  ignoring:' + s.ignoring + '  edge:' + (s.edge || '-') + '\n' +
    // v3.4：情绪值 / 光标距离 / 是否在飞。
    // 这三项不摆出来的话，"情绪到没到 angry""光标推来了没""投掷结束了没"
    // 在无头截图里全都只能靠猜。
    'mood   : ' + s.mood + ' (' + s.moodBand + ')\n' +
    'cursor : ' + (s.cursorDist > 9000 ? 'n/a' : s.cursorDist) + 'px\n' +
    'throw  : ' + s.throwing + '\n' +
    // 最后触发的动作名 + 距今多久。
    // 为什么要这个：无头截图**抓不准动画帧**（虚拟时间轴 vs CSS 动画，项目文档里有记录），
    // 所以"摸头时到底跑没跑 nod""裙摆有没有 huff"只能靠读数证明 —— 看像素会白忙一场。
    'anim   : ' + (s.anim || '-') + (s.animAge >= 0 ? '  (' + s.animAge + 'ms ago)' : '') + '\n' +
    // ---- v3.6：生活流行为链 ----
    // chain: 她此刻那条链走到第几拍。格式 `节点#拍数`，末尾带 × 表示那一拍**没做成**
    //        （前提不满足，典型是"她已经坐着了"还抽到 sit）—— 这个 × 是判断
    //        "链的门槛逻辑有没有生效"的唯一证据。
    // run  : 链是不是正在跑。一碰她/一打字就该变成 false（打断那条路径）。
    // b    : 链剩下的预算。它归零 = 收链，是"不会卡在同一个动作上"的结构性保证。
    'chain  : ' + s.chain + '  run=' + s.chainRun +
      '  b=' + s.chainBudget + 'ms  步=' + s.chainSteps + '\n' +
    // ---- v3.12：前台应用 / 时间感知 ----
    // scene 是渲染层**此刻持有的**那个场景 —— 也就是"主进程推来的 scene 有没有被
    //   接住"（onScene 接线）。浏览器里没有真前台窗口，所以它只能靠按钮喂。
    // perch 同理：替身只记请求、不真挪舞台（理由见替身里的说明）。
    // time 是"此刻该用哪一组问候"（纯函数，可直接断言）+ 当前小时 + 上次报时的整点
    //   （-1 = 还没报过；真时钟等不到整点，这个数就是"调度真的跑过"的旁证）。
    'scene  : ' + s.scene + '  perch=' + !!window.pet._perch + '\n' +
    'time   : ' + s.daypart + '  ' + s.hour + 'h  chime=' +
      (s.chimeHour < 0 ? '-' : s.chimeHour + 'h') + '\n' +
    // 走动这一趟的起终目标。位移本身是无头模式下验不了的（rAF 不推进），
    // 但"目标算得对不对"能验 —— 而目标算错才是真会出问题的那种
    // （朝光标走却写死走向 x=0 之类）。积分由 selftest 第 12 节保证。
    'walk   : ' + s.walkGoal + (s.walkDir ? '  dir=' + (s.walkDir < 0 ? '←' : '→') : '') + '\n' +
    // 投掷的**边界计划**。飞行本身在无头模式下跑不完（rAF 不推进），
    // 但"左右极限有没有把角色透明边算进去"能验 —— 而这条换成窗口矩形的话
    // 画面上几乎看不出（只是提前 100 来像素弹回来）。收敛性见 selftest 第 12 节。
    'throwp : ' + s.throwPlan + '\n' +
    // 目光跟随的实际 transform。
    // 这里必须读 **inline style**，不能读 getComputedStyle：#lookWrap 上有 .3s 缓动，
    // 而无头模式用的是虚拟时间轴 —— 缓动永远停在起始帧，计算样式会一直返回
    // matrix(1,0,0,1,0,0)（恒等矩阵），看上去像"跟随压根没生效"。
    // inline style 是**目标值**，写入即生效，是唯一能在冻结时间轴下确定它真的跑了的读数。
    'look   : ' + (document.getElementById('lookWrap').style.transform || '(none)') + '\n' +
    // ---- v3.9：差分图层 ----
    // eye/mouth 是"期望槽位"（eyeForced 优先），on 是**图层元素是否真的挂着 .on**。
    // 两个都要看：只有 eye 而 on=false，说明 src 还没解码完（图不在/太慢），
    // 而这一种在截图上和"她刚好睁着眼"完全一样 —— 分不清就白验了。
    // slots 是当前套装声明的槽位，用来把"这套没做差分"和"接线断了"分开。
    // spriteWrap 的 transform 也在这一行里顺带看一眼：走动翻转写在容器上，
    // 写在 #fBase 上的话图层不会跟着翻，而静止画面上看不出任何区别。
    'eye    : ' + (s.eye || '(open)') + (s.eyeForced ? ' [forced]' : '') +
      '  on=' + s.eyeOn + '  slots=' + JSON.stringify(s.eyeSlots) + '\n' +
    'mouth  : ' + (s.mouth || '(closed)') + '  on=' + s.mouthOn +
      '  slots=' + JSON.stringify(s.mouthSlots) + '\n' +
    'flip   : ' + (document.getElementById('spriteWrap').style.transform || '(none)') + '\n' +
    'pos    : ' + Math.round(virtualPos.x) + ',' + Math.round(virtualPos.y) + '\n' +
    'padX   : ' + padXFor(s.outfit) + '\n' +
    // ---- v3.5：点击穿透 ----
    // hit : 上报给主进程的**可交互框**（窗口本地 px）。真机里框外一律穿透 ——
    //       也就是"点下去会落到下面的桌面图标上"。框应当贴着角色轮廓，
    //       而不是整个窗口（整窗就说明又退回"她周围一片空气点不下去"了）。
    //       判据看百分比：水手服显示宽只有 188px，所以框应该是窗口宽的 ~51%，
    //       不再是 100%；同时框的左边界应当接近 padX 那一行（= 两侧透明边的宽）。
    // over: 渲染层主动喊过几声"光标压在我身上"。它是把进入角色的延迟从
    //       120ms 压到一帧的那条快路径，恒为 0 就说明 forward 的 mousemove 没到。
    (function () {
      const h = window.__petDemo.hitInfo();
      const b = h.box;
      // 预览页的 #stage 被 translate 过，所以这里报出来的是**页面坐标**，
      // 减掉 virtualPos 才是"窗口本地" —— 也就是真机上主进程拿到的那个坐标系。
      // 不减的话读数会带一个 800 多的偏移，看着"像是框跑到屏幕外了"。
      const lx = -Math.round(virtualPos.x), ly = -Math.round(virtualPos.y);
      return 'hit    : ' + (b
        ? [b.l + lx, b.t + ly, b.r - b.l, b.b - b.t].map(Math.round).join(',') +
          '  ' + (Math.round(1000 * (b.r - b.l) / winW) / 10) + '% of win'
        : '(null = 整窗穿透)') + '\n' +
        'sprite : ' + h.sprite + '  (角色显示尺寸)\n' +
        'over   : ' + h.over + '\n';
    })() +
    // 腮红是只有 1.7s 的短动画，无头截图很容易拍到它已经收尾的那一帧。
    // 把实时 opacity 摆出来，才能区分"没触发"和"拍晚了"。
    'blush  : ' + getComputedStyle(document.getElementById('blush')).opacity + '\n' +
    // 气泡：摆出**排版后的实际尺寸**和字号。气泡尺寸走的是 cqw（跟着窗口等比），
    // 而"到底有没有跟着窗口走"从截图上是量不准的 —— 试过按亮度找气泡，
    // 结果被浅色假桌面骗了。直接读浏览器的排版结果才是确定的。
    // 判据见 tools/measure_bubble.py：坐标一律相对"窗口"（#stage）上沿。
    (function () {
      const b = document.getElementById('bubble');
      const r = b.getBoundingClientRect();
      const st = document.getElementById('stage').getBoundingClientRect();
      const fs = parseFloat(getComputedStyle(b).fontSize);
      return 'bubble : ' + Math.round(r.width) + 'x' + Math.round(r.height) +
             '  font ' + fs.toFixed(2) + 'px  ' +
             (Math.round(1000 * r.width / winW) / 10) + '% of win' +
             '  top ' + Math.round(r.top - st.top) + 'px' +
             '  bot ' + Math.round(r.bottom - st.top) + 'px';
    })() + '\n' +
    // 顶部信息条：量**内容**（徽章 + 气泡两个子项的并集外框），别量 #topBar 自己 ——
    // v3.6 起 #topBar 就是那条留白带本身（top:0; height:22cqw），
    // 所以它自己的矩形恒等于"0 .. 带高"，拿它去比"在不在带子里"永远成立，是空转的。
    // （这条检查前后写空转过两次：先是量满宽容器的宽度、再是量带子自身的上下界。）
    // 另外单独摆出**徽章自己的尺寸** —— 横排之后徽章比气泡矮，它不再影响总高，
    // 于是"徽章到底显示了没有"从总高上看不出来，不给出来这条测试就是空转的。
    (function () {
      const st = document.getElementById('stage').getBoundingClientRect();
      const bd = document.getElementById('badge');
      const rb = bd.getBoundingClientRect();
      let L = Infinity, R = -Infinity, T = Infinity, B = -Infinity;
      for (const el of [bd, document.getElementById('bubble')]) {
        const q = el.getBoundingClientRect();
        if (q.width <= 0) continue;
        L = Math.min(L, q.left - st.left);
        R = Math.max(R, q.right - st.left);
        T = Math.min(T, q.top - st.top);
        B = Math.max(B, q.bottom - st.top);
      }
      const nan = L === Infinity;
      return 'topBar : band ' + Math.round(TOP_PAD_RATIO * winW) + 'px' +
             '  badge ' + Math.round(rb.width) + 'x' + Math.round(rb.height) +
             '  kids ' + (nan ? '-' : Math.round(L)) + '..' + (nan ? '-' : Math.round(R)) +
             '  v ' + (nan ? '-' : Math.round(T)) + '..' + (nan ? '-' : Math.round(B));
    })();
}, 250);
</script>
</body>
</html>
